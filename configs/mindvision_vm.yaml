# 虚拟机 + 迈德威视相机 专用配置文件
enemy_color: "red"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU # 虚拟机中必须使用 CPU，不能使用 GPU
# 注意：这个值同时控制两条检测通道，改一处即可：
#   - YOLO 通道（yolos/yolov5.cpp:198）过滤的是检测框 score
#   - 传统方法通道（detector.cpp:253）过滤的是 tiny_resnet 分类置信度
# 原文件在"传统方法参数"段也写了一份同名 key，但两个检测器都读 yaml["min_confidence"]，
# 重复 key 只会有一个生效（yaml-cpp 后者覆盖前者），改了一份另一份白改，极易误判。
# 2026-11-20 已删除重复项，本值即为全局唯一入口。
# 2026-11-20 实测定为 0.6。四轮对比（单板场景，近 2m）：
#   0.2 跟住率 100% / 0.8 跟住率 92.2% 且 lost 6.5%
#   0.6 跟住率 99.0%、lost 0.4%、armor_num 均值 0.971（检出率 97.1%，零误检）
# 0.6 全面优于 0.8，故定稿此值。
min_confidence: 0.6
use_traditional: true

#####-----迈德威视工业相机参数-----#####
camera_name: "mindvision"
# 2.0ms 是 2026-11-17/18 标定 R_dig 时使用的曝光，不要随意改动，
# 否则已标定的 R 与噪声水平失配（σ ∝ 1/√t_exp）。
# 真机 sentry.yaml 用 0.8ms，上车后需按 σ² 比例放大 R 再复核 nis。
exposure_ms: 2.0
gamma: 0.5
vid_pid: "f622:d13a"

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 2.5
max_rectangular_error: 40
# min_confidence 已上移到"神经网络参数"段，全文件只保留一处（见该处注释）

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

# 单板联调模式：测试架上只有 1 块装甲板时打开。
# 4 板模型会预测出 3 块幻影板，且装甲板 id 会在 0~3 之间乱跳（jumped 恒为真），
# 转角 a 被反复拽动，w 完全不可信。开启后按 1 块板建模，
# 预测的装甲板位置和实物一一对应。上车务必改回 false。
single_armor_test: true

# 1、3 号板相对 0、2 号板的半径差 / 高度差（米）。缺省 0。
# 为什么要手填：单块板可见时 id 永远停在 0，这两个量的雅可比列恒为 0，
# 滤波器没有观测通道去估计（实测 sigma 一直是 0，一个数都不动）。
# 它们是车体的几何常数，卷尺量出来填比让滤波器猜可靠。
#   armor_l = 1/3 号板到转轴距离 − 0/2 号板到转轴距离
#   armor_h = 1/3 号板离地高度 − 0/2 号板离地高度
# 怎么定符号（看绿框相对实物的偏差）：
#   绿框比实物更远离轴心 → 实际半径更小 → armor_l 填负值
#   绿框比实物更靠近轴心 → 实际半径更大 → armor_l 填正值
armor_l: 0.0
armor_h: 0.0

#####-----aimer参数-----#####
yaw_offset: -1.0
pitch_offset: -1.0
comming_angle: 60
leaving_angle: 20
decision_speed: 8
high_speed_delay_time: 0.030
low_speed_delay_time: 0.015

#####-----shooter参数-----#####
first_tolerance: 3
second_tolerance: 2
judge_distance: 2
auto_fire: true

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# 重投影误差: 1.0722px
camera_matrix: [1757.35, 0, 639.50, 0, 1754.99, 511.50, 0, 0, 1]
distort_coeffs: [-0.0369, -0.2629, 0.00549, -0.00169, 1.609]
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
t_camera2gimbal: [0, 0, 0]
