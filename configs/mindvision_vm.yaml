# 虚拟机 + 迈德威视相机 专用配置文件
enemy_color: "red"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU # 虚拟机中必须使用 CPU，不能使用 GPU
min_confidence: 0.2
use_traditional: true

#####-----迈德威视工业相机参数-----#####
camera_name: "mindvision"
# 2.0ms 是 2026-11-17/18 标定 R_dig 时使用的曝光，不要随意改动，
# 否则已标定的 R 与噪声水平失配（σ ∝ 1/√t_exp）。
# 真机 sentry.yaml 用 0.8ms，上车后需按 σ² 比例放大 R 再复核 nis。
exposure_ms: 2.0
gamma: 0.5
vid_pid: "f622:d13a"

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 2.5
max_rectangular_error: 40
min_confidence: 0.2

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -1.0
pitch_offset: -1.0
comming_angle: 60
leaving_angle: 20
decision_speed: 8
high_speed_delay_time: 0.030
low_speed_delay_time: 0.015

#####-----shooter参数-----#####
first_tolerance: 3
second_tolerance: 2
judge_distance: 2
auto_fire: true

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# 重投影误差: 1.0722px
camera_matrix: [1757.35, 0, 639.50, 0, 1754.99, 511.50, 0, 0, 1]
distort_coeffs: [-0.0369, -0.2629, 0.00549, -0.00169, 1.609]
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
t_camera2gimbal: [0, 0, 0]
