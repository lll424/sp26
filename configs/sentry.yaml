# enemy_color: "red"
enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
# 注意：这个值同时控制两条检测通道，改一处即可：
#   - YOLO 通道（yolos/yolov5.cpp:198）过滤的是检测框 score
#   - 传统方法通道（detector.cpp:253）过滤的是 tiny_resnet 分类置信度
# 原文件在"传统方法参数"段也写了一份同名 key，但两个检测器都读 yaml["min_confidence"]，
# 重复 key 只会有一个生效，改了一份另一份白改。2026-11-20 已删除重复项。
# 2026-11-20 由 0.8 下调为 0.6。
# 依据：VM 同款相机实测，0.8 时跟住率仅 92.2%、lost 占 6.5%；
# 0.6 时跟住率 99.0%、lost 0.4%、armor_num 均值 0.971（检出率 97.1%、零误检）。
# 真机条件更差（0.8ms 曝光比 VM 的 2.0ms 暗、距离更远、背景更杂），
# 0.8 只会更糟，故取 0.6。
# ⚠️ 这是基于 VM 数据的推断，上车后必须实测 armor_num 复核：
#    检出率明显低于 95% → 继续下调；armor_num 出现 >1 或 id 乱跳 → 上调。
min_confidence: 0.6
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----USB相机参数-----#####
image_width: 1280
image_height: 720
fov_h: 57.7 #87.7
fov_v: 56.7 
new_fov_h: 27 #67
new_fov_v: 40.9
usb_frame_rate: 120
usb_exposure: 500 #1-80000______250
usb_gamma: 160
usb_gain: 10 #0-96

#####-----工业相机参数-----#####
# 2026-11-20 换装 MindVision（原为 hikrobot）。
# io/camera.cpp 按 camera_name 选择实现，两个分支读的字段不同：
#   mindvision -> exposure_ms + gamma   + vid_pid
#   hikrobot   -> exposure_ms + gain    + vid_pid
# 所以必须用 gamma，不能留 gain（缺 gamma 会在 tools::read 抛异常）。
camera_name: "mindvision"
# 第一阶段沿用 VM 的 2.0ms，与 R_dig 的标定条件一致，减少一个变量。
# 链路跑通后再降到 0.8ms（运动模糊更小），届时 R_dig 需重新标定。
exposure_ms: 2.0
gamma: 0.5
vid_pid: "f622:d13a"

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
# min_confidence 已上移到"神经网络参数"段，全文件只保留一处（见该处注释）

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -0.8 # degree -2.5
pitch_offset: -1  # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
left_yaw_offset: -1
right_yaw_offset: -0.6
decision_speed: 10 # rad/s
high_speed_delay_time: 0.026 # s
low_speed_delay_time: 0.010 # s

#####-----shooter参数-----#####
first_tolerance: 5 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 3 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----decider参数-----#####
mode: 1

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 2026-11-20 换装 MindVision，内参同步替换为这台相机的自标结果。
# 原 hikrobot 的值（fx=2414.94, cx=717.26, cy=582.69）已作废，不要再混用。
# 旧值备份：camera_matrix [2414.9359264386621, 0, 717.26243105567414, 0, 2418.0489262208148, 582.68540529942845, 0, 0, 1]
#           distort_coeffs [-0.0209453389287673, 0.15028138841073832, -0.0006517722113234505, -0.0016861906197686788, 0]
# 重投影误差: 1.0722px
camera_matrix: [1757.35, 0, 639.50, 0, 1754.99, 511.50, 0, 0, 1]
distort_coeffs: [-0.0369, -0.2629, 0.00549, -0.00169, 1.609]

# ⚠️ 以下两个是 hikrobot 的安装标定值，换相机后【必须重标】。
# 保留在原位只是为了让程序能跑起来；装车后立刻跑 calibrate_handeye，
# 否则会引入固定的角度/位置偏差（t 偏 10cm 在 3m 处约等于 1.9° 误差）。
# 相机同理想情况的偏角: yaw-1.11 pitch0.01 roll-0.06 degree
# 标定板到世界坐标系原点的水平距离: 1.20 m
# 标定板同竖直摆放时的偏角: yaw123.89 pitch14.05 roll-0.86 degree
R_camera2gimbal: [0.01928451708725664, 0.00012696140743255463, 0.99981402834802846, -0.99981344688553653, -0.0010834913551969569, 0.019284643459122196, 0.0010857382619952124, -0.99999940496346484, 0.00010604311483339372]
t_camera2gimbal: [0.13089617453251859, 0.0038468007459533785, 0.094139945222010288]
